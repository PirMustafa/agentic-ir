# ============================================================
# Agentic AI for Information Retrieval
# Central configuration. Every knob referenced in the report
# should be traceable to a value in this file.
# ============================================================

project:
  name: agentic-ir
  student_id: D03000104
  seed: 42

paths:
  raw: data/raw
  processed: data/processed
  indexes: data/indexes
  results: results

# ------------------------------------------------------------
# Datasets
# ------------------------------------------------------------
datasets:
  hotpotqa:
    enabled: true
    hf_id: hotpotqa/hotpot_qa
    hf_config: distractor
    split: validation
    # Stratified evaluation sample. Full split is 7,405 questions;
    # a full agentic run over it is ~10h on an 8GB laptop GPU.
    eval_sample: 250
    strata: [level]              # easy / medium / hard

  twowiki:
    enabled: true
    # 2WikiMultihopQA. Ships gold Wikidata evidence triples, which is
    # what lets us score the KG Navigator against ground truth.
    #
    # NOT xanhho/2WikiMultihopQA: that repo is a script loader, and datasets
    # >=4.0 removed script support entirely ("Dataset scripts are no longer
    # supported"), with no trust_remote_code escape hatch. This mirror is
    # parquet, and its supporting_facts/context shapes match HotpotQA's, so
    # one loader handles both datasets.
    hf_id: framolfese/2WikiMultihopQA
    split: validation
    eval_sample: 250
    strata: [type]               # comparison / inference / compositional / bridge_comparison

# ------------------------------------------------------------
# Local LLM (Ollama). No API keys anywhere in this project.
# ------------------------------------------------------------
llm:
  provider: ollama
  host: http://localhost:11434
  # Per-agent models. Planner and Verifier get the reasoning model;
  # the high-volume Retrieval agent gets the cheaper/faster path.
  default_model: qwen3:8b
  fallback_model: qwen2.5:7b-instruct
  models:
    planner:   qwen3:8b
    retriever: qwen3:8b
    kg:        qwen3:8b
    verifier:  qwen3:8b
    synthesizer: qwen3:8b
  options:
    temperature: 0.0
    top_p: 0.9
    num_ctx: 8192
    num_predict: 1024
    seed: 42
  # qwen3 is a hybrid reasoning model and emits <think>...</think> by default.
  # At ~30-45 tok/s that is 10-20s of pure waste per call, so it is suppressed
  # three ways: this flag, a /no_think system suffix, and response stripping.
  think: false
  # Retries on malformed structured output before falling back to a
  # deterministic default. Logged as `parse_failures` in the run trace.
  max_format_retries: 2
  request_timeout_s: 180
  # Response cache. Makes a completed run exactly reproducible and turns
  # re-runs after a harness bug from hours into seconds. Latency figures in
  # the report must come from a cold-cache run (meta.json records which).
  cache:
    enabled: true
    path: data/cache/llm_cache.sqlite

# ------------------------------------------------------------
# Retrieval
# ------------------------------------------------------------
retrieval:
  sparse:
    method: bm25
    k1: 0.9
    b: 0.4
    stemmer: english
  dense:
    model: BAAI/bge-small-en-v1.5
    dim: 384
    # GPU only for the offline index build; at query time the encoders live on
    # CPU so Ollama gets the whole card. See docs/environment-validation.md.
    build_device: cuda
    query_device: cpu
    normalize: true
    batch_size: 256
    query_prefix: "Represent this sentence for searching relevant passages: "
    index_type: flat_ip          # exact search; corpus is small enough
  hybrid:
    method: rrf
    rrf_k: 60
  rerank:
    enabled: true
    model: cross-encoder/ms-marco-MiniLM-L-6-v2
    device: cpu                  # ~0.3-0.6s for 50 short passages; keeps VRAM free
    top_n: 50                    # rerank depth
  top_k: 10                      # final passages returned per sub-query

# ------------------------------------------------------------
# Agents
# ------------------------------------------------------------
agents:
  planner:
    max_subqueries: 5
    max_replans: 2               # Verifier -> Planner feedback loop depth
    allow_query_rewrite: true
    # Fire the comparison template before the LLM. Kept OFF for the headline
    # agentic_full config so the planning claim stays honest; reported
    # separately as an efficiency ablation.
    template_shortcut: false
  retriever:
    tools: [bm25_search, dense_search, hybrid_search, rerank]
    # When the tool choice is unambiguous, skip the LLM call and use a
    # rule. Measured and reported as `llm_calls_saved`.
    heuristic_shortcut: true
    multi_query: true
    max_rewrites: 2              # expansion rides inside the planner call: 0 extra LLM calls
    # Skip the cross-encoder when the fused top-1 is already decisively ahead;
    # 50 forward passes that cannot change the answer are not worth running.
    rerank_margin_gate: 0.15
  kg:
    enabled: true
    max_hops: 2
    max_neighbors: 25
    entity_linker: alias_match   # alias_match | llm
  verifier:
    enabled: true
    method: nli_plus_llm         # nli | llm | nli_plus_llm
    nli_model: cross-encoder/nli-deberta-v3-base
    nli_device: cpu              # ~0.5-2s; VRAM is fully committed to Ollama
    confidence_threshold: 0.55   # below this -> trigger a re-plan
    require_citations: true
    max_evidence: 20
    # Call the LLM adjudicator only inside +/- this band around the threshold.
    # Confident accepts and confident rejects never spend a call.
    uncertainty_band: 0.15
    weights: {nli: 0.45, citation: 0.25, retrieval: 0.15, llm: 0.15}

orchestrator:
  max_iterations: 6
  max_llm_calls_per_question: 20
  max_wall_clock_s: 300
  # Only the synthesizer and verifier may spend the last N calls, so an answer
  # is always produced even when the planner exhausts the budget.
  reserve_llm_calls: 2
  # argmax(confidence) over ALL cycles, not the last one -- a bad re-plan must
  # not silently overwrite a better first answer.
  answer_selection: best_confidence
  trace: true                    # write full per-question JSONL trace

# ------------------------------------------------------------
# Evaluation
# ------------------------------------------------------------
evaluation:
  retrieval_metrics: [recall@2, recall@5, recall@10, ndcg@10, mrr]
  answer_metrics: [em, f1]
  support_metrics: [sp_em, sp_f1]
  agent_metrics: [llm_calls, tool_calls, latency_s, plan_depth, replan_rate, citation_grounding]
  bootstrap_samples: 1000        # for confidence intervals
  configurations:
    - bm25_only
    - dense_only
    - hybrid_rerank
    - naive_rag
    - self_ask
    - agentic_full
    - agentic_no_planner
    - agentic_no_kg
    - agentic_no_verifier

# ------------------------------------------------------------
# Tracing
# ------------------------------------------------------------
trace:
  dir: results/runs
  raw_output_chars: 2000
